server {
	listen 80;
	server_name eventhub.omi.bz;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	server_name eventhub.omi.bz;

	ssl_certificate /etc/letsencrypt/live/eventhub.omi.bz/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/eventhub.omi.bz/privkey.pem;

	client_max_body_size 50M;

	location /api/ {
		proxy_pass http://127.0.0.1:4200/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# The backend intentionally exposes email verification outside /api.
	location = /verify-email {
		proxy_pass http://127.0.0.1:4200/verify-email$is_args$args;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
